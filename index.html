<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshai & Aparna | The Wedding Reception</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #c5a059; --charcoal: #2d2d2d; --cream: #fdfbf7; --spotify-green: #1DB954; }
        body { margin: 0; font-family: 'Lato', sans-serif; background: var(--cream); color: var(--charcoal); text-align: center; scroll-behavior: smooth; overflow-x: hidden; }

        .heart { position: fixed; color: rgba(197, 160, 89, 0.4); font-size: 15px; z-index: 999; pointer-events: none; animation: float 10s linear infinite; bottom: -50px; }
        @keyframes float {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        .music-player-fixed { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex; align-items: center; background: rgba(18, 18, 18, 0.75); backdrop-filter: blur(12px); padding: 8px 18px; border-radius: 30px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); gap: 10px; }
        .music-info { color: white; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
        .wave-container { display: flex; align-items: flex-end; gap: 3px; height: 12px; }
        .wave-bar { width: 2px; background: var(--spotify-green); height: 3px; }
        .playing .wave-bar { animation: wave-animation 1s ease-in-out infinite; }
        @keyframes wave-animation { 0%, 100% { height: 3px; } 50% { height: 12px; } }

        .hero { position: relative; height: 90vh; width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; color: white; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; }
        .slide.active { opacity: 1; }
        .hero::after { content: ''; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.3); }
        .hero-frame { position: relative; z-index: 3; padding: 40px 30px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border-radius: 4px; }
        .hero h1 { font-family: 'Great Vibes'; font-size: clamp(40px, 8vw, 75px); }
        .hero p { font-family: 'Playfair Display'; letter-spacing: 4px; font-size: 11px; }
        .hero-date { font-style: italic; font-size: 18px; }

        .section { padding: 30px 20px; opacity: 0; transform: translateY(15px); transition: 0.8s; }
        .section.show { opacity: 1; transform: translateY(0); }

        .card { background: white; max-width: 580px; margin: auto; padding: 35px 25px; }
        .decorative-divider { width: 50px; height: 1px; background: var(--gold); margin: 15px auto; }
        h2 { font-family: 'Playfair Display'; letter-spacing: 3px; }

        .btn-primary { background: var(--charcoal); color: white; padding: 12px 35px; text-decoration: none; }

        #wishes-container { text-align: left; }
        .wish-item.hidden { display: none; }

        .countdown-container { display: flex; justify-content: center; gap: 20px; }
        .countdown-number { font-size: 28px; color: var(--gold); }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .gallery img { width: 100%; height: 350px; object-fit: cover; cursor: pointer; }

        .lightbox { display:none; position:fixed; width:100%; height:100%; background:white; }
        .lightbox img { max-width:90%; max-height:80vh; }

        .footer { padding:40px; }
    </style>
</head>

<body>

<div class="music-player-fixed" id="music-pill">
    <div class="wave-container"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
    <span class="music-info" id="music-text">Enable Music</span>
</div>

<div class="hero">
    <div class="slide active" style="background-image:url('https://raw.githubusercontent.com/DearlyWed/akshaiwedsaparna/main/bg07.jpeg')"></div>
    <div class="hero-frame">
        <p>The Wedding Reception of</p>
        <h1>Akshai & Aparna</h1>
        <p class="hero-date">Sunday, April 5th, 2026</p>
    </div>
</div>

<div class="section">
    <div class="card">
        <h2>Welcome</h2>
        <p>Join us in celebrating our new life together.</p>
    </div>
</div>

<div class="section">
    <div class="card">
        <h2>The Event</h2>
        <p>St. Thomas Convention Centre</p>
        <a href="https://maps.app.goo.gl/yoPZqwS9EALzJuAJ6" class="btn-primary">View Map</a>
    </div>
</div>

<div class="section">
    <div class="countdown-container">
        <div><span id="days">00</span>Days</div>
        <div><span id="hours">00</span>Hours</div>
        <div><span id="mins">00</span>Mins</div>
        <div><span id="secs">00</span>Secs</div>
    </div>
</div>

<div class="section">
    <div class="card">
        <h2>Wishes</h2>
        <form id="wish-form">
            <input id="guest-name" required placeholder="Your Name">
            <textarea id="guest-message" required></textarea>
            <button type="submit">Send</button>
        </form>
        <div id="wishes-container"></div>
    </div>
</div>

<audio id="bg-music" src="https://raw.githubusercontent.com/DearlyWed/akshaiwedsaparna/main/Raatharakaye.mp3" loop></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDBOc5l9FuuT8PzjGTTGqj_a7dVSuR_438",
  authDomain: "akshaiweddinginvitation.firebaseapp.com",
  databaseURL: "https://akshaiweddinginvitation-default-rtdb.firebaseio.com",
  projectId: "akshaiweddinginvitation",
  storageBucket: "akshaiweddinginvitation.firebasestorage.app",
  messagingSenderId: "1013141775399",
  appId: "1:1013141775399:web:71f0fd6b1cd3fefb0a1a02"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const wishesRef = ref(db, 'wishes');

document.getElementById('wish-form').onsubmit = (e) => {
    e.preventDefault();
    push(wishesRef, {
        name: document.getElementById('guest-name').value,
        message: document.getElementById('guest-message').value,
        timestamp: serverTimestamp()
    });
};

onValue(wishesRef, (snapshot) => {
    const data = snapshot.val();
    const container = document.getElementById('wishes-container');
    container.innerHTML = "";
    if (!data) return;
    Object.values(data).reverse().forEach(w => {
        container.innerHTML += `<p><b>${w.name}</b>: ${w.message}</p>`;
    });
});
</script>

</body>
</html>
