<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshai & Aparna | The Wedding Reception</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #c5a059; --charcoal: #2d2d2d; --cream: #fdfbf7; --spotify-green: #1DB954; }
        body { margin: 0; font-family: 'Lato', sans-serif; background: var(--cream); color: var(--charcoal); text-align: center; scroll-behavior: smooth; overflow-x: hidden; }
        .heart { position: fixed; color: rgba(197, 160, 89, 0.4); font-size: 15px; z-index: 999; pointer-events: none; animation: float 10s linear infinite; bottom: -50px; }
        @keyframes float { 0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100vh) translateX(50px) rotate(360deg); opacity: 0; } }
        .music-player-fixed { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex; align-items: center; background: rgba(18, 18, 18, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 8px 18px; border-radius: 30px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); gap: 10px; }
        .music-info { color: white; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
        .wave-container { display: flex; align-items: flex-end; gap: 3px; height: 12px; }
        .wave-bar { width: 2px; background: var(--spotify-green); height: 3px; }
        .playing .wave-bar { animation: wave-animation 1s ease-in-out infinite; }
        @keyframes wave-animation { 0%, 100% { height: 3px; } 50% { height: 12px; } }

        .hero { position: relative; height: 90vh; width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; color: white; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; z-index: 1; }
        .slide.active { opacity: 1; }
        .hero::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 2; }
        .hero-frame { position: relative; z-index: 3; padding: 40px 30px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 4px; max-width: 80%; }
        .hero h1 { font-family: 'Great Vibes', cursive; font-size: clamp(40px, 8vw, 75px); margin: 10px 0; color: #fff; }
        .hero p { font-family: 'Playfair Display', serif; letter-spacing: 4px; text-transform: uppercase; font-size: 11px; margin: 0; }
        .hero-date { font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; margin-top: 15px !important; }

        .section { padding: 30px 20px; opacity: 0; transform: translateY(15px); transition: all 0.8s ease-out; }
        .section.show { opacity: 1; transform: translateY(0); }
        .card { background: white; max-width: 580px; margin: auto; padding: 35px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #f2f2f2; }
        .decorative-divider { width: 50px; height: 1px; background: var(--gold); margin: 15px auto; }
        h2 { font-family: 'Playfair Display', serif; font-size: 22px; text-transform: uppercase; letter-spacing: 3px; color: var(--charcoal); margin: 0; }
        .btn-primary { background: var(--charcoal); color: white; border: 1px solid var(--gold); padding: 12px 35px; text-decoration: none; display: inline-block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; margin-top: 15px; cursor: pointer; }
        #wishes-container { text-align: left; margin-top: 15px; }
        .wish-item { padding: 10px 0; border-bottom: 1px solid #f9f9f9; display: block; }
        .wish-item.hidden { display: none; }
        .toggle-wishes { color: var(--gold); font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; display: inline-block; }
        .countdown-container { display: flex; justify-content: center; gap: 20px; margin: 10px 0; }
        .countdown-number { display: block; font-size: 28px; font-family: 'Playfair Display', serif; color: var(--gold); }
        .countdown-label { font-size: 9px; text-transform: uppercase; color: #bbb; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; max-width: 1000px; margin: 20px auto; }
        .gallery img { width: 100%; height: 350px; object-fit: cover; border: 8px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.05); cursor: pointer; }
        .footer { padding: 40px 20px; background: #faf8f4; border-top: 1px solid #eee; }
        .lightbox { display: none; position: fixed; z-index: 6000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); }
        .lightbox img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 90%; max-height: 80vh; border: 10px solid white; }
        .family-wish { margin-top: 20px; font-family: 'Great Vibes', cursive; font-size: 24px; color: var(--gold); }
        .credit-link { display: block; font-size: 9px; letter-spacing: 2px; color: #aaa; text-decoration: none; margin-top: 15px; transition: 0.3s; text-transform: uppercase; }
    </style>
</head>

<body>
<!-- (Everything unchanged above) -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ✅ UPDATED FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyDBOc5l9FuuT8PzjGTTGqj_a7dVSuR_438",
        authDomain: "akshaiweddinginvitation.firebaseapp.com",
        databaseURL: "https://akshaiweddinginvitation-default-rtdb.firebaseio.com", 
        projectId: "akshaiweddinginvitation",
        storageBucket: "akshaiweddinginvitation.firebasestorage.app",
        messagingSenderId: "1013141775399",
        appId: "1:1013141775399:web:71f0fd6b1cd3fefb0a1a02"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const wishesRef = ref(db, 'wishes');

    document.getElementById('wish-form').onsubmit = (e) => {
        e.preventDefault();
        push(wishesRef, {
            name: document.getElementById('guest-name').value,
            message: document.getElementById('guest-message').value,
            timestamp: serverTimestamp()
        }).then(() => e.target.reset());
    };

    onValue(wishesRef, (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('wishes-container');
        const toggleBtn = document.getElementById('toggle-btn');
        container.innerHTML = "";
        if (!data) return;
        const allWishes = Object.values(data).reverse();
        allWishes.forEach((w, index) => {
            const div = document.createElement('div');
            div.className = index >= 3 ? "wish-item hidden" : "wish-item";
            div.innerHTML = `<strong style="font-size:10px; color:var(--gold);">${w.name}</strong><p style="font-size:13px; color:#777; margin:2px 0;">"${w.message}"</p>`;
            container.appendChild(div);
        });
        if (allWishes.length > 3) { toggleBtn.style.display = "inline-block"; toggleBtn.innerText = "Show More"; }
        else { toggleBtn.style.display = "none"; }
    });
</script>

<!-- (Rest of JS unchanged) -->

</body>
</html>
